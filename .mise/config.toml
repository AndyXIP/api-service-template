# Keep in sync with `version` in .github/actions/mise-install/action.yml
min_version = "2026.11.7"

[tools]
python = "3.14.10"
uv = "0.13.8"

[settings]
locked = true
locked_verify_provenance = true

[env]
# Stop uv picking its own managed Python over mise's
UV_PYTHON_PREFERENCE = "only-system"
# mise creates + activates the venv; `--prompt .` names it after the repo dir
_.python.venv = { path = ".venv", create = true, uv_create_args = ["--prompt", "."] }

[hooks]
enter = "uv sync --all-groups -q && pre-commit install --hook-type pre-commit --hook-type pre-push > /dev/null"
