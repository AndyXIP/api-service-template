# Keep in sync with `version` in .github/actions/mise-install/action.yml
min_version = "2026.11.7"

[tools]
python = "3.14.10"
uv = "0.13.8"

[settings]
python.uv_venv_auto = "source"
locked = true
locked_verify_provenance = true

[env]
# Stop uv picking its own managed Python over mise's
UV_PYTHON_PREFERENCE = "only-system"

[hooks]
# Hook creates the venv (not mise) so `--prompt .` names it after the repo dir
enter = "[ -d .venv ] || uv venv -q --prompt .; uv sync --all-groups -q && .venv/bin/pre-commit install --hook-type pre-commit --hook-type pre-push > /dev/null"
