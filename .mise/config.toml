# Keep in sync with `version` in .github/actions/mise-install/action.yml
min_version = "2026.11.7"

[tools]
python = "3.14.10"
uv = "0.13.8"

[settings]
python.uv_venv_auto = "create|source"
python.uv_venv_create_args = ["--prompt", "."]
locked = true
locked_verify_provenance = true

[env]
UV_PYTHON_PREFERENCE = "only-system"

[hooks]
enter = "uv sync --all-groups -q && pre-commit install --hook-type pre-commit --hook-type pre-push > /dev/null"
